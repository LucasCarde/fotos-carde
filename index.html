<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fotos · Carde</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@100..150,420..620&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f3f0e8;
        --muted: rgba(243, 240, 232, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #070708;
        color: var(--ink);
        font-family: Outfit, sans-serif;
      }

      .frame {
        min-height: 100vh;
        padding: 16px;
      }

      .stage {
        position: relative;
        min-height: calc(100vh - 32px);
        border-radius: 28px;
        overflow: hidden;
        background: #12110f url("fondo.png") center 42% / cover no-repeat;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(to top, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.18) 38%, rgba(0, 0, 0, 0.28) 100%);
      }

      .top {
        position: absolute;
        z-index: 2;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(8, 8, 10, 0.62);
        backdrop-filter: blur(10px);
        font-size: 14px;
        letter-spacing: 0.01em;
      }

      .bottom {
        position: absolute;
        z-index: 2;
        left: 28px;
        right: 28px;
        bottom: 10px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
      }

      h1 {
        margin: 0;
        font-family: Anybody, sans-serif;
        font-weight: 500;
        font-stretch: 140%;
        font-size: clamp(84px, 17vw, 188px);
        line-height: 0.8;
        letter-spacing: -0.05em;
      }

      h1 span {
        font-size: 0.28em;
        vertical-align: super;
        margin-left: 0.08em;
        letter-spacing: 0;
      }

      .side {
        width: min(250px, 34vw);
        padding-bottom: 28px;
      }

      .side p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .go {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 7px 7px 7px 16px;
        border-radius: 999px;
        background: #f4f1ea;
        color: #1c1c1c;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
      }

      .go i {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #2b2b2b;
        color: #fff;
        font-style: normal;
      }

      @media (max-width: 900px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }

        .frame {
          min-height: 100dvh;
          padding: 8px;
        }

        .stage {
          min-height: calc(100dvh - 16px);
          border-radius: 22px;
          background-position: center 46%;
        }

        .stage::after {
          background:
            linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.35) 34%, rgba(0, 0, 0, 0.22) 100%);
        }

        .top {
          top: 14px;
          padding: 8px 14px;
          font-size: 13px;
        }

        .bottom {
          left: 18px;
          right: 18px;
          bottom: max(18px, env(safe-area-inset-bottom));
          flex-direction: column;
          align-items: stretch;
          gap: 16px;
        }

        h1 {
          font-stretch: 112%;
          font-size: clamp(58px, 16.5vw, 84px);
          letter-spacing: -0.045em;
        }

        .side {
          width: 100%;
          padding-bottom: 0;
        }

        .side p {
          margin: 0 0 14px;
          font-size: 14px;
        }

        .go {
          width: 100%;
          min-height: 54px;
          justify-content: space-between;
          padding: 8px 8px 8px 18px;
          font-size: 17px;
        }

        .go i {
          width: 38px;
          height: 38px;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <main class="stage">
        <div class="top">Carde</div>
        <div class="bottom">
          <h1>Fotos<span>*</span></h1>
          <div class="side">
            <p>Si no carga, la computadora está apagada.</p>
            <a class="go" id="entrar" href="https://tomatoes-wars-analysts-factory.trycloudflare.com">Ver fotos <i>→</i></a>
          </div>
        </div>
      </main>
    </div>
    <script>
      const button = document.getElementById("entrar");
      fetch("link.txt?t=" + Date.now(), { cache: "no-store" })
        .then((response) => response.text())
        .then((text) => {
          const url = (text.trim().split(/\s+/)[0] || "").replace(/\/$/, "");
          if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) {
            button.href = url;
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
